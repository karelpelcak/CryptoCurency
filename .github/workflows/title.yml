name: PR Title Check

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title follows convention
        uses: amannn/action-semantic-pull-request@v5
        with:
          types: |
            feat
            fix
            update
          requireScope: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

